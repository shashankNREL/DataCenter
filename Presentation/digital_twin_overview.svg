      .eyebrow { font-size: 17px; font-weight: 600; fill: #58636f; }
      .stage { font-size: 18px; font-weight: 650; fill: #2451a6; }
      .section-title { font-size: 28px; font-weight: 650; }
      .asset-title { font-size: 25px; font-weight: 650; }
