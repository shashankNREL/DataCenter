  <text class="benefit-body" x="992" y="955">Stress-test ramps, outages</text>
  <text class="benefit-body" x="992" y="984">and backup-power reserves.</text>
  <path d="M1456 877 H1498" stroke="#bc4a60" stroke-width="4"/>
  <text class="benefit-title" x="1456" y="918" data-max-width="400">Protect compute value</text>
  <text class="benefit-body" x="1456" y="955">Meet service targets while</text>
  <text class="benefit-body" x="1456" y="984">shaping infrastructure demand.</text>

  <text class="small" x="64" y="1027" data-max-width="1792">Open-source foundation: ExaDigiT/RAPS | pandapower + ANDES | PyBaMM / BLAST-Lite | OpenModelica | pyLife | OR-Tools / HiGHS</text>
  <text class="small" x="64" y="1056" data-max-width="1792">Concept architecture. Benefits require calibration and validation. Existing equipment controls and protection remain authoritative.</text>
</svg>