  <text class="body" x="1545" y="551" data-max-width="287">Place or stagger AI jobs</text>
  <use href="#check" x="1509" y="572" width="24" height="24"/>
  <text class="body" x="1545" y="591" data-max-width="287">Dispatch turbines + BESS</text>
  <use href="#check" x="1509" y="612" width="24" height="24"/>
  <text class="body" x="1545" y="631" data-max-width="287">Meet deadlines + reserves</text>
  <path d="M1483 660 H1855 V706 Q1855 713 1848 713 H1490 Q1483 713 1483 706 Z" fill="#fff6e9"/>
  <text x="1669" y="693" font-size="18" font-weight="600" text-anchor="middle" data-max-width="342">Safety checks + operator approval</text>

  <path d="M1669 714 V750 Q1669 777 1642 777 H286 Q259 777 259 750 V716" fill="none" stroke="#147d72" stroke-width="3" marker-end="url(#arrow-teal)"/>
