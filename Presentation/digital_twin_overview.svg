  <path d="M528 877 H570" stroke="#147d72" stroke-width="4"/>
  <text class="benefit-title" x="528" y="918" data-max-width="420">Reduce lifecycle cost</text>
  <text class="benefit-body" x="528" y="955">Balance energy, equipment wear</text>
