  <text class="section-title" x="64" y="280" data-max-width="390">Your operating data center</text>
  <text class="stage" x="592" y="238">02 / PREDICT</text>
  <text class="section-title" x="592" y="280" data-max-width="752">One twin. Four asset-life models.</text>
  <text class="stage" x="1482" y="238">03 / OPTIMIZE</text>
  <text class="section-title" x="1482" y="280" data-max-width="374">Coordinate the decisions</text>

