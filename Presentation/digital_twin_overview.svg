      .benefit-title { font-size: 27px; font-weight: 650; }
      .benefit-body { font-size: 21px; fill: #58636f; }
      .device { fill: #ffffff; stroke: #334650; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
