  <g fill="#147d72" stroke="#ffffff" stroke-width="3">
    <circle cx="1796" cy="365" r="12"/><circle cx="1796" cy="411" r="12"/><circle cx="1796" cy="457" r="12"/>
  </g>
  <text class="detail" x="1669" y="495" text-anchor="middle" data-max-width="326">Feasible job-to-resource matching</text>
