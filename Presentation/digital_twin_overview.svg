  <rect width="1920" height="1080" fill="#f7f9f8"/>
  <path d="M64 44 H112" stroke="#147d72" stroke-width="5"/>
  <text class="eyebrow" x="128" y="50">PROPOSED OPEN-SOURCE RESEARCH PLATFORM</text>
  <text class="eyebrow" x="1856" y="50" text-anchor="end">DESIGN + OPERATIONS</text>
  <text x="64" y="121" font-size="60" font-weight="650">Data Center Lifetime Digital Twin</text>
  <text x="64" y="170" font-size="27" fill="#58636f">Connect AI scheduling to equipment life, power capacity and operating cost.</text>
  <path d="M64 199 H1856" stroke="#d8dfdf" stroke-width="1.5"/>

